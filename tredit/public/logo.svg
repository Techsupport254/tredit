<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle with gradient -->
    <circle cx="100" cy="100" r="90" fill="url(#gradient)" />
    
    <!-- Abstract T composition -->
    <g transform="translate(100 100)">
        <!-- Main vertical element -->
        <path d="M-15 -45 
                 C-15 -45, -5 -45, 5 -45
                 L15 -45
                 C25 -45, 25 -35, 15 -25
                 L5 -15
                 C0 -10, 0 -5, 0 0
                 L0 20
                 C0 30, -5 35, -15 35
                 L-20 35
                 C-25 35, -25 25, -20 20
                 L-15 15
                 C-10 10, -10 5, -10 0
                 L-10 -15
                 C-10 -20, -12 -22, -15 -25
                 L-25 -35
                 C-30 -40, -25 -45, -15 -45Z" 
              fill="white">
        <animate attributeName="fill-opacity"
                 from="0" to="1"
                 dur="0.8s"
                 fill="freeze" />
    </path>

        <!-- Horizontal elements -->
        <path d="M-40 -45
                 C-40 -45, -30 -45, -20 -45
                 L40 -45
                 C50 -45, 50 -35, 40 -35
                 L-20 -35
                 C-30 -35, -40 -35, -40 -45Z" 
              fill="white">
        <animate attributeName="fill-opacity"
                 from="0" to="1"
                 dur="0.8s"
                 fill="freeze" />
    </path>

        <!-- Dynamic elements -->
        <path d="M15 -15
                 L35 5
                 C40 10, 35 15, 30 15
                 L10 -5
                 C5 -10, 10 -15, 15 -15Z" 
              fill="white"
              opacity="0.9">
            <animate attributeName="opacity"
                     values="0;0.9;0.7;0.9"
                     dur="1.5s"
                     fill="freeze" />
        </path>

        <path d="M20 5
                 L40 25
                 C45 30, 40 35, 35 35
                 L15 15
                 C10 10, 15 5, 20 5Z" 
              fill="white"
              opacity="0.7">
            <animate attributeName="opacity"
                     values="0;0.7;0.5;0.7"
                     dur="1.5s"
                     fill="freeze" />
        </path>
    </g>

    <!-- Gradient definition -->
    <defs>
        <linearGradient id="gradient" x1="0" y1="0" x2="200" y2="200">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
    </defs>
</svg> 