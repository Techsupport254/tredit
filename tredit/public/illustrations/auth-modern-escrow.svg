<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Soft background shapes -->
  <circle cx="150" cy="150" r="120" fill="url(#grad1)" filter="url(#softGlow)"/>
  <ellipse cx="280" cy="250" rx="100" ry="80" fill="url(#grad2)" filter="url(#softGlow)"/>

  <!-- Central Shield Icon (Subtle) -->
  <path d="M200 120 L240 140 L240 200 Q240 220 220 230 L200 240 L180 230 Q160 220 160 200 L160 140 Z" 
        fill="#BFDBFE" fill-opacity="0.1" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Abstract Node/Link Elements -->
  <circle cx="200" cy="180" r="8" fill="#60A5FA" fill-opacity="0.2"/>
  <circle cx="170" cy="210" r="6" fill="#93C5FD" fill-opacity="0.15"/>
  <circle cx="230" cy="210" r="6" fill="#93C5FD" fill-opacity="0.15"/>
  
  <line x1="200" y1="180" x2="170" y2="210" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>
  <line x1="200" y1="180" x2="230" y2="210" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3"/>

  <!-- Floating Geometric Shapes -->
  <rect x="120" y="250" width="50" height="50" rx="10" fill="#BFDBFE" fill-opacity="0.08" transform="rotate(-15 145 275)"/>
  <path d="M280 150 L310 180 L280 210 L250 180 Z" fill="#93C5FD" fill-opacity="0.06"/>
  
</svg> 