<?xml version="1.0" encoding="UTF-8"?>
<svg width="340" height="340" viewBox="0 0 340 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf1fb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="shield" x1="120" y1="60" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Soft background blob -->
  <ellipse cx="170" cy="170" rx="160" ry="120" fill="url(#bg)"/>
  <!-- Abstract shield -->
  <path d="M170 80 Q210 100 200 170 Q190 240 170 250 Q150 240 140 170 Q130 100 170 80Z" fill="url(#shield)"/>
  <!-- Blockchain nodes -->
  <circle cx="170" cy="120" r="10" fill="#60a5fa" fill-opacity="0.18"/>
  <circle cx="140" cy="160" r="8" fill="#60a5fa" fill-opacity="0.13"/>
  <circle cx="200" cy="160" r="8" fill="#60a5fa" fill-opacity="0.13"/>
  <circle cx="170" cy="210" r="7" fill="#60a5fa" fill-opacity="0.13"/>
  <!-- Chain links -->
  <rect x="154" y="135" width="32" height="8" rx="4" fill="url(#chain)" transform="rotate(20 170 139)"/>
  <rect x="154" y="175" width="32" height="8" rx="4" fill="url(#chain)" transform="rotate(-20 170 179)"/>
  <!-- Dotted connections -->
  <circle cx="170" cy="120" r="2" fill="#2563eb" fill-opacity="0.12"/>
  <circle cx="140" cy="160" r="2" fill="#2563eb" fill-opacity="0.12"/>
  <circle cx="200" cy="160" r="2" fill="#2563eb" fill-opacity="0.12"/>
  <circle cx="170" cy="210" r="2" fill="#2563eb" fill-opacity="0.12"/>
  <line x1="170" y1="120" x2="140" y2="160" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.18"/>
  <line x1="170" y1="120" x2="200" y2="160" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.18"/>
  <line x1="140" y1="160" x2="170" y2="210" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.18"/>
  <line x1="200" y1="160" x2="170" y2="210" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.18"/>
</svg> 