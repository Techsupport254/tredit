<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="450" viewBox="0 0 400 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Soft background shapes -->
  <ellipse cx="100" cy="150" rx="150" ry="100" fill="url(#grad1)" filter="url(#softBlur)" />
  <ellipse cx="300" cy="300" rx="180" ry="120" fill="url(#grad2)" filter="url(#softBlur)" />

  <!-- Elegant Flowing Lines -->
  <path d="M50 150 
           C 150 50, 250 250, 350 150 
           S 250 450, 150 350 
           S -50 250, 50 150 Z" 
        stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>

  <path d="M80 200 
           C 180 100, 280 300, 380 200 
           S 280 500, 180 400 
           S -20 300, 80 200 Z" 
        stroke="#60A5FA" stroke-width="1" stroke-opacity="0.15" fill="none" stroke-dasharray="5 5"/>

   <path d="M120 180 
           C 220 80, 320 280, 420 180 
           S 320 480, 220 380 
           S 20 280, 120 180 Z" 
        stroke="#BFDBFE" stroke-width="0.75" stroke-opacity="0.1" fill="none"/>

  <!-- Subtle Dots/Nodes -->
  <g opacity="0.5">
    <circle cx="150" cy="100" r="3" fill="#BFDBFE" fill-opacity="0.5"/>
    <circle cx="250" cy="350" r="3" fill="#BFDBFE" fill-opacity="0.5"/>
    <circle cx="350" cy="150" r="2.5" fill="#93C5FD" fill-opacity="0.4"/>
    <circle cx="50" cy="300" r="2.5" fill="#93C5FD" fill-opacity="0.4"/>
  </g>
  
</svg> 