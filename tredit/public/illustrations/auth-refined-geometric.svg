<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComponentTransfer in="blur" result="boostedBlur">
          <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
          <feMergeNode in="boostedBlur"/>
          <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Gradient Shapes -->
  <path d="M50 50 Q150 -50 250 50 T450 50 V450 H-50 Z" fill="url(#grad1)" opacity="0.5"/>
  <path d="M350 350 Q250 450 150 350 T-50 350 V-50 H450 Z" fill="url(#grad2)" opacity="0.5"/>

  <!-- Central Geometric Structure (Hexagons) -->
  <g opacity="0.3" filter="url(#subtleGlow)">
    <path d="M200 130 L235 150 L235 190 L200 210 L165 190 L165 150 Z" stroke="#BFDBFE" stroke-width="1.5"/>
    <path d="M235 150 L270 170 L270 210 L235 230 L200 210" stroke="#93C5FD" stroke-width="1"/>
    <path d="M165 150 L130 170 L130 210 L165 230 L200 210" stroke="#93C5FD" stroke-width="1"/>
    <path d="M200 210 L235 230 L235 270 L200 290 L165 270 L165 230 Z" stroke="#BFDBFE" stroke-width="1"/>
  </g>

  <!-- Connecting Lines & Nodes -->
  <g opacity="0.4">
    <line x1="200" y1="210" x2="200" y2="290" stroke="#60A5FA" stroke-width="0.75" stroke-dasharray="2 2"/>
    <line x1="235" y1="190" x2="270" y2="210" stroke="#60A5FA" stroke-width="0.75" stroke-dasharray="2 2"/>
    <line x1="165" y1="190" x2="130" y2="210" stroke="#60A5FA" stroke-width="0.75" stroke-dasharray="2 2"/>

    <circle cx="200" cy="130" r="3" fill="#BFDBFE"/>
    <circle cx="270" cy="170" r="2.5" fill="#93C5FD"/>
    <circle cx="130" cy="170" r="2.5" fill="#93C5FD"/>
    <circle cx="200" cy="290" r="3" fill="#BFDBFE"/>
  </g>

</svg> 